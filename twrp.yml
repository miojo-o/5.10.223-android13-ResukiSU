on:
   push:
     branches: [main]

env:
  WORKSPACE: ${{ github.workspace }}
  KERNEL: "${{ github.workspace }}/kernel"

jobs:
  build:
    runs-on: ubuntu-latest
   
    permissions:
      contents: write
     
    defaults:
      run:
        shell: bash
   
    steps:
    - uses: actions/checkout@v4
    
    - name: free_disk_space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: install_packages
      working-directory: ${{ github.workspace }}
      run: |
        sudo apt update && sudo apt upgrade -y

        sudo apt ibstall gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar abootimg


    - name: clone_twrp_a145p
      working-directory: ${{ github.workspace }}
      run: |
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 abootimg

        repo sync -j$(nproc) --force-sync

    - name: get_image
      working-directory: ${{ github.workspace }}
      run: |
        abootimg -x boot.img
        
        mv zImage Image

    - name: clone_device_tree
      working-directory: ${{ github.workspace }}
      run: |
        git clone https://github.com/forforksake/recovery_device_samsung_a14m.git

        ls -a

