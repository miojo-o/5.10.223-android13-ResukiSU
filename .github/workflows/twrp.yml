on:
   push:
     branches: [main]

env:
  WORKSPACE: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest
   
    permissions:
      contents: write
     
    defaults:
      run:
        shell: bash
   
    steps:
    - uses: actions/checkout@v4

    - name: set_up_ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-twrp
    
    - name: free_disk_space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: install_packages
      working-directory: ${{ github.workspace }}
      run: |
        sudo apt update && sudo apt upgrade -y

        sudo apt remove -y lib32ncurses5-dev || true
        
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libncurses-dev libz-dev libxml2-utils xsltproc zip zlib1g-dev abootimg python3 repo

    - name: clone_twrp
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p ./twrp && cd ./twrp
        
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 --depth=1

        repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: clone_device_tree
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p ./twrp/device/samsung

        git clone https://github.com/forforksake/recovery_device_samsung_a14m.git ./twrp/device/samsung/a145m
        
    - name: get_more_space
      working-directory: ${{ github.workspace }}/twrp
      run: |
        RECOVERY="./device/samsung/a145m/recovery"

        # more space
        #sed -i 's/BOARD_RECOVERYIMAGE_PARTITION_SIZE := .*/BOARD_RECOVERYIMAGE_PARTITION_SIZE := 90000000/g' ./twrp/device/samsung/a145m/BoardConfig.mk
        
        rm -rf "$RECOVERY/root/vendor/tee"
        rm -rf "$RECOVERY/root/system/etc/vintf"

        rm -f "$RECOVERY/root/vendor/firmware/soc1_0_ram_bt_*.bin"
        rm -f "$RECOVERY/root/vendor/firmware/WIFI_RAM_CODE_soc1_0_1a_1.bin"

        # audio
        rm -f "$RECOVERY/root/vendor/lib/libaudio*.so"
        rm -f "$RECOVERY/root/system/lib64/libaudio*.so"

    - name: fix_device_path(create symlink)
      working-directory: ${{ github.workspace }}
      run: |
        cd ./twrp/device/samsung
        ln -s a145m a14m
 
    - name: copy_kernel_and_dtb
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p ./twrp/device/samsung/a145m/prebuilt

        cp ./Image ./twrp/device/samsung/a145m/prebuilt/Image

        cp ./dtb.img ./twrp/device/samsung/a145m/prebuilt/dtb.img

        cp ./dtbo.img ./twrp/device/samsung/a145m/prebuilt/dtbo.img

        echo "TARGET_PREBUILT_KERNEL := \$(DEVICE_PATH)/prebuilt/Image" >> ./twrp/device/samsung/a145m/BoardConfig.mk
        
    - name: make_image
      working-directory: ${{ github.workspace }}/twrp
      run: |
          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          lunch twrp_a14m-eng

          mka recoveryimage -j$(nproc)
          
    - name: upload_recovery
      uses: actions/upload-artifact@v4
      with:
        name: twrp-a145m
        path: ./twrp/out/target/product/a14m/recovery.img
